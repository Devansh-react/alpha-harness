<svg xmlns="http://www.w3.org/2000/svg" viewBox="84 84 344 344" width="100%" height="100%">
  <!-- mark.svg's weave alone, for tabs and other small places: no panel, cropped to the weave.
       There is no light palette, so on a light tab bar the ink track takes canvas instead. -->
  <style>
    .ink { stroke: #010102; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f7f8f8; }
    }
  </style>
  <g transform="translate(216, 256) rotate(-45)" fill="none" stroke-width="32" stroke-linecap="butt">
    <g stroke="#5e6ad2">
      <path d="M 60 164 L 60 88" />
      <path d="M 60 32 L 60 0 A 60 60 0 1 0 0 60 L 80 60" />
      <path d="M 136 60 L 164 60" />
    </g>
    <g class="ink">
      <path d="M 108 164 L 108 136" />
      <path d="M 108 80 L 108 0 A 108 108 0 1 0 0 108 L 32 108" />
      <path d="M 88 108 L 164 108" />
    </g>
  </g>
</svg>
