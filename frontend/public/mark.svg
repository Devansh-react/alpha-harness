<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 88 336 336" width="100%" height="100%">
  <!-- The Alpha Harness mark: a 4px-grid topological weave, on nothing, so it sits on any
       taskbar, Dock or page. Width 32px, channel gap 16px, cutout gap 12px.
       Inner track: primary (#5e6ad2). Outer track: ink (#f7f8f8). -->
  <g transform="translate(216, 256) rotate(-45)" fill="none" stroke-width="32" stroke-linecap="butt">
    <!-- Inner execution harness (R = 60) -->
    <g stroke="#5e6ad2">
      <!-- Bottom-right tail: passes over the outer track at y=108, stops 12px before y=60 -->
      <path d="M 60 164 L 60 88" />
      <!-- Core loop: resumes 12px after y=60, arcs 270°, passes over at x=60, stops 12px before x=108 -->
      <path d="M 60 32 L 60 0 A 60 60 0 1 0 0 60 L 80 60" />
      <!-- Top-right tail: resumes 12px after x=108 -->
      <path d="M 136 60 L 164 60" />
    </g>
    <!-- Outer alpha signal (R = 108) -->
    <g stroke="#f7f8f8">
      <!-- Bottom-right tail: stops 12px before y=108 -->
      <path d="M 108 164 L 108 136" />
      <!-- Outer loop: resumes 12px after y=108, passes over the inner track at y=60, arcs 270°, stops 12px before x=60 -->
      <path d="M 108 80 L 108 0 A 108 108 0 1 0 0 108 L 32 108" />
      <!-- Top-right tail: resumes 12px after x=60, passes over at x=108 -->
      <path d="M 88 108 L 164 108" />
    </g>
  </g>
</svg>
